name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: unbuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: actions/setup-node@v5
        with:
          node-version: '20'
      - run: npm install
      - run: npm run lint
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: actions/setup-node@v5
        with:
          node-version: '20'
      - run: npm install
      - run: npm test
